<style>
  :root {
    --ground: #F0F2E9;
    --paper: #FAFBF5;
    --ink: #14201C;
    --green: #00463C;
    --green-tint: #E6EBE0;
    --muted: #55645B;
    --blue: #2C4A6E;
    --brass: #8F6D12;
    --rule: #C6CDBD;

    --display: "Newsreader", "Iowan Old Style", Palatino, Georgia, "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", SimSun, serif;
    --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.68;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--blue); text-decoration: none; border-bottom: 1px solid rgba(44,74,110,0.28); }
  a:hover { border-bottom-color: var(--blue); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 44px; }

  /* ---------- Top navigation ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(240, 242, 233, 0.93);
    backdrop-filter: saturate(160%) blur(8px);
    border-bottom: 1px solid var(--rule);
  }
  .topbar .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    height: 62px;
  }
  .navlinks { display: flex; gap: 30px; list-style: none; margin: 0; padding: 0; overflow-x: auto; scrollbar-width: none; }
  .navlinks::-webkit-scrollbar { display: none; }
  .navlinks a {
    font-size: 15px;
    color: var(--muted);
    border: none;
    padding: 4px 0;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  .navlinks a:hover { color: var(--ink); }
  .navlinks a.on { color: var(--green); font-weight: 600; border-bottom-color: var(--green); }

  .langtoggle { display: flex; border: 1px solid var(--rule); background: var(--paper); flex-shrink: 0; }
  .langtoggle button {
    font-family: var(--mono);
    font-size: 13.5px;
    letter-spacing: 0.09em;
    padding: 9px 16px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .langtoggle button[aria-pressed="true"] { background: var(--green); color: var(--paper); }

  /* ---------- Hero ---------- */
  .hero {
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 84px 0 62px;
    margin-bottom: 34px;
  }
  .portrait {
    width: 268px;
    height: 268px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--green-tint);
  }
  .name {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(42px, 5.2vw, 62px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 0 0 20px;
    color: var(--green);
  }
  .herolinks { display: flex; flex-wrap: wrap; gap: 10px 12px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 15.5px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 9px 16px;
    transition: border-color 0.16s ease, color 0.16s ease;
  }
  .pill:hover { border-color: var(--green); color: var(--green); }
  .pill svg { width: 17px; height: 17px; flex-shrink: 0; }
  .pill.ghost { background: transparent; cursor: pointer; font-family: var(--sans); }

  /* ---------- Section headers ---------- */
  section { padding: 0 0 84px; scroll-margin-top: 80px; }
  h2 {
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: var(--display);
    font-weight: 400;
    font-size: 34px;
    letter-spacing: -0.01em;
    color: var(--green);
    margin: 0 0 30px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

  h3.sub {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
    margin: 46px 0 18px;
  }

  .lede { font-size: 18px; line-height: 1.76; max-width: 88ch; margin: 0 0 20px; }
  p { max-width: 88ch; }

  /* About runs as a centred measure so the long text is not stranded left */
  #about .lede, #about .strip { max-width: 92ch; margin-left: auto; margin-right: auto; }

  /* ---------- Cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-top: 2px solid var(--green);
    padding: 26px 24px 28px;
    transition: border-top-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover {
    border-top-color: var(--brass);
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(20,32,28,0.06);
  }
  .card h4 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 21px;
    line-height: 1.26;
    margin: 0 0 11px;
    color: var(--green);
  }
  .card p { font-size: 15px; line-height: 1.62; color: var(--muted); margin: 0; max-width: none; }

  /* ---------- Teaching cards ---------- */
  .teachgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .tcard {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 22px 22px 18px;
    min-height: 168px;
    transition: border-color 0.18s ease, transform 0.18s ease;
  }
  .tcard:hover { border-color: var(--green); transform: translateY(-3px); }
  .tcard h4 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 20px;
    line-height: 1.3;
    margin: 0 0 8px;
    color: var(--green);
  }
  .tcard h4 a { color: inherit; border-bottom: 1px solid rgba(0,70,60,0.28); }
  .tcard h4 a:hover { border-bottom-color: var(--green); }
  .tcard .code { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.07em; color: var(--muted); }
  .tcard .foot { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
  .term {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--brass);
    border: 1px solid rgba(143,109,18,0.35);
    padding: 3px 8px;
  }

  /* ---------- Affiliation strip ---------- */
  .strip {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 16px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--brass);
    padding: 20px 24px;
    margin-top: 30px;
  }
  .strip .role {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .strip .org { font-family: var(--display); font-size: 22px; color: var(--green); }
  .strip .org a { color: inherit; border-bottom: 1px solid rgba(0,70,60,0.35); }
  .strip .org a:hover { border-bottom-color: var(--green); }

  /* ---------- Publications ---------- */
  .pub { padding: 20px 0; border-bottom: 1px solid var(--rule); }
  .pub:first-of-type { padding-top: 2px; }
  .pub-title { font-family: var(--display); font-size: 22px; line-height: 1.34; margin: 0 0 8px; max-width: 60ch; }
  .pub-meta { font-size: 15px; color: var(--muted); }
  .pub-outlet { font-style: italic; }
  .alt {
    font-family: var(--sans);
    font-style: normal;
    font-size: 0.7em;
    color: var(--muted);
    margin-left: 8px;
    letter-spacing: 0;
  }
  .status {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
    border: 1px solid rgba(143,109,18,0.35);
    padding: 3px 8px;
    margin-bottom: 10px;
  }

  /* ---------- Conferences ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip {
    font-family: var(--sans);
    font-size: 14px;
    padding: 6px 13px;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--paper); }
  .chip.year[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); }
  .filter-row { display: flex; gap: 16px; align-items: baseline; margin-bottom: 10px; flex-wrap: wrap; }
  .filter-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    min-width: 52px;
  }
  .tally {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin: 18px 0 30px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
  }
  .yearblock { display: grid; grid-template-columns: 96px 1fr; gap: 24px; margin-bottom: 34px; }
  .yearmark { font-family: var(--display); font-size: 34px; color: var(--green); line-height: 1; padding-top: 0; }
  .talklist { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); }
  .talk { padding: 0 0 24px 26px; position: relative; }
  .talk::before {
    content: "";
    position: absolute;
    left: -5px;
    top: 10px;
    width: 9px;
    height: 9px;
    background: var(--ground);
    border: 1px solid var(--green);
    border-radius: 50%;
  }
  .talk-venue { font-weight: 600; font-size: 17px; }
  .talk-where { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin-top: 3px; }
  .talk-paper { font-family: var(--display); font-style: italic; font-size: 16.5px; margin-top: 6px; max-width: 66ch; line-height: 1.42; }
  .empty { font-family: var(--display); font-style: italic; color: var(--muted); padding: 20px 0; }

  /* ---------- CV ---------- */
  .cvbtn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    padding: 13px 22px;
    background: var(--green);
    color: var(--paper);
    border: 1px solid var(--green);
  }
  .cvbtn:hover { background: transparent; color: var(--green); }
  .cvbtn svg { width: 15px; height: 15px; }
  .cvgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 38px 56px; margin-top: 40px; }
  .entry { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .entry-main { font-size: 16px; line-height: 1.45; }
  .entry-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .entry-when { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: 0.05em; white-space: nowrap; }
  .taglist { font-size: 15.5px; color: var(--muted); line-height: 1.72; }

  /* ---------- Contact ---------- */
  footer {
    border-top: 1px solid var(--rule);
    padding: 26px 0 60px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  /* ---------- Chinese mode ---------- */
  html[lang="zh"] .talk-paper, html[lang="zh"] .empty, html[lang="zh"] .pub-outlet { font-style: normal; }
  html[lang="zh"] .name { line-height: 1.16; letter-spacing: 0.02em; }
  html[lang="zh"] .lede, html[lang="zh"] p { max-width: 46em; }

  @media (max-width: 1000px) {
    .cards, .teachgrid { grid-template-columns: repeat(2, 1fr); }
    .portrait { width: 210px; height: 210px; }
    .hero { gap: 40px; }
  }
  @media (max-width: 720px) {
    .wrap { padding: 0 22px; }
    body { font-size: 16px; }
    .cards, .teachgrid { grid-template-columns: 1fr; }
    .cvgrid { grid-template-columns: 1fr; gap: 30px; }
    .hero { flex-direction: column; align-items: flex-start; gap: 28px; padding: 48px 0 30px; margin-bottom: 24px; }
    .portrait { width: 168px; height: 168px; }
    h2 { font-size: 27px; gap: 14px; }
    .yearblock { grid-template-columns: 60px 1fr; gap: 16px; }
    .yearmark { font-size: 24px; }
    .navlinks { gap: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; animation: none !important; }
  }
</style>

const SECTIONS = ["about", "research", "publications", "teaching", "conferences", "cv", "contact"];

function useScrollSpy() {
  const [active, setActive] = useState("about");
  useEffect(() => {
    const obs = new IntersectionObserver(
      entries => {
        const visible = entries.filter(e => e.isIntersecting)
                               .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (visible.length) setActive(visible[0].target.id);
      },
      { rootMargin: "-15% 0px -70% 0px", threshold: 0 }
    );
    SECTIONS.forEach(id => {
      const el = document.getElementById(id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, []);
  return active;
}

function TopBar({ L, lang, setLang, active }) {
  return (
    <nav className="topbar">
      <div className="wrap">
        <ul className="navlinks">
          {SECTIONS.map(id => (
            <li key={id}>
              <a href={"#" + id} className={active === id ? "on" : ""}>{L(T[id])}</a>
            </li>
          ))}
        </ul>
        <div className="langtoggle" role="group" aria-label="Language">
          <button onClick={() => setLang("en")} aria-pressed={lang === "en"}>EN</button>
          <button onClick={() => setLang("zh")} aria-pressed={lang === "zh"}>中文</button>
        </div>
      </div>
    </nav>
  );
}

function Conferences({ L }) {
  const [topic, setTopic] = useState("all");
  const [year, setYear] = useState("all");

  const years = useMemo(() => [...new Set(TALKS.map(t => t.year))].sort((a, b) => b - a), []);

  const shown = useMemo(() =>
    TALKS.filter(t => topic === "all" || t.topic === topic)
         .filter(t => year === "all" || t.year === year)
         .sort((a, b) => b.sort.localeCompare(a.sort)),
    [topic, year]);

  const grouped = useMemo(() => {
    const map = new Map();
    shown.forEach(t => {
      if (!map.has(t.year)) map.set(t.year, []);
      map.get(t.year).push(t);
    });
    return [...map.entries()].sort((a, b) => b[0] - a[0]);
  }, [shown]);

  const paperCount = new Set(shown.map(t => t.topic)).size;

  return (
    <section id="conferences">
      <h2>{L(T.conferences)}</h2>

      <div className="filter-row">
        <span className="filter-label">{L(T.filterBy)}</span>
        <div className="filters">
          <button className="chip" aria-pressed={topic === "all"} onClick={() => setTopic("all")}>{L(T.all)}</button>
          {TOPICS.map(p => (
            <button key={p.id} className="chip" aria-pressed={topic === p.id} onClick={() => setTopic(p.id)}>
              {L(p.label)}
            </button>
          ))}
        </div>
      </div>

      <div className="filter-row">
        <span className="filter-label">{L(T.filterYr)}</span>
        <div className="filters">
          <button className="chip year" aria-pressed={year === "all"} onClick={() => setYear("all")}>{L(T.all)}</button>
          {years.map(y => (
            <button key={y} className="chip year" aria-pressed={year === y} onClick={() => setYear(y)}>{y}</button>
          ))}
        </div>
      </div>

      <p className="tally">{L(T.tally)(shown.length, paperCount)}</p>

      {grouped.length === 0 && <p className="empty">{L(T.none)}</p>}

      {grouped.map(([y, list]) => (
        <div className="yearblock" key={y}>
          <div className="yearmark">{y}</div>
          <ul className="talklist">
            {list.map((t, i) => (
              <li className="talk" key={y + "-" + i}>
                <div className="talk-venue">{L(t.venue)}</div>
                <div className="talk-where">{[L(t.org), L(t.place), L(t.date)].filter(Boolean).join("  ·  ")}</div>
                {topic === "all" && <div className="talk-paper">{L(t.paper)}</div>}
              </li>
            ))}
          </ul>
        </div>
      ))}
    </section>
  );
}

function EntryList({ items, L }) {
  return (
    <div>
      {items.map((e, i) => (
        <div className="entry" key={i}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: "16px", alignItems: "baseline" }}>
            <div className="entry-main">{L(e.main)}</div>
            <div className="entry-when">{e.when}</div>
          </div>
          {e.sub && <div className="entry-sub">{L(e.sub)}</div>}
        </div>
      ))}
    </div>
  );
}

function App() {
  const [lang, setLang] = useState("en");
  const [copied, setCopied] = useState(false);
  const L = v => (v && typeof v === "object" && !Array.isArray(v) && ("en" in v) ? v[lang] : v);
  const active = useScrollSpy();

  useEffect(() => { document.documentElement.lang = lang === "zh" ? "zh" : "en"; }, [lang]);

  const copy = () => {
    navigator.clipboard.writeText(PROFILE.email).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    });
  };

  return (
    <React.Fragment>
      <TopBar L={L} lang={lang} setLang={setLang} active={active} />

      <div className="wrap">
        <header className="hero">
          <img className="portrait" src={PROFILE.photo} alt={PROFILE.name} />
          <div>
            <h1 className="name">{lang === "zh" ? PROFILE.nameZh : PROFILE.name}</h1>
            <div className="herolinks">
              <a className="pill" href={"mailto:" + PROFILE.email}><MailIcon />{PROFILE.email}</a>
              <a className="pill" href={PROFILE.linkedin} target="_blank" rel="noopener"><LinkedInIcon />{L(T.linkedin)}</a>
              <a className="pill" href={PROFILE.york} target="_blank" rel="noopener"><YorkIcon />{L(T.yorkProfile)}</a>
            </div>
          </div>
        </header>

        <main>
          <section id="about">
            <h2>{L(T.about)}</h2>
            {L(PROFILE.about).map((para, i) => <p className="lede" key={i}>{para}</p>)}
            <div className="strip">
              <span className="role">{L(T.leadOrganizer)}</span>
              <span className="org">
                <a href={GCS_URL} target="_blank" rel="noopener">{L(T.gcsName)}</a>
              </span>
            </div>
          </section>

          <section id="research">
            <h2>{L(T.research)}</h2>
            <div className="cards">
              {INTERESTS.map(c => (
                <article className="card" key={c.title.en}>
                  <h4>{L(c.title)}</h4>
                  <p>{L(c.text)}</p>
                </article>
              ))}
            </div>
          </section>

          <section id="publications">
            <h2>{L(T.publications)}</h2>
            <h3 className="sub" style={{ marginTop: 0 }}>{L(T.workingPapers)}</h3>
            {PAPERS.map(p => (
              <article className="pub" key={p.title.en}>
                <span className="status">{L(p.status)}</span>
                <h4 className="pub-title">
                  {L(p.title)}
                  {lang === "zh" && <span className="alt">({p.title.en})</span>}
                </h4>
                <div className="pub-meta">
                  {p.authors} ({p.year})
                  {p.outlet && (
                    <span>. <span className="pub-outlet">{L(p.outlet)}</span>
                      {lang === "zh" && <span className="alt">({p.outlet.en})</span>}
                    </span>
                  )}
                </div>
              </article>
            ))}
          </section>

          <section id="teaching">
            <h2>{L(T.teaching)}</h2>
            <p className="lede">{L(TEACHING_NOTE)}</p>
            <div className="teachgrid">
              {TEACHING.map(m => (
                <article className="tcard" key={m.code}>
                  <div>
                    <h4>
                      <a href={MODULE_CATALOGUE + m.code + "/latest"} target="_blank" rel="noopener">{L(m.name)}</a>
                    </h4>
                    <span className="code">{m.code}</span>
                  </div>
                  <div className="foot">
                    {m.terms.map(t => <span className="term" key={t}>{t}</span>)}
                  </div>
                </article>
              ))}
            </div>
          </section>

          <Conferences L={L} />

          <section id="cv">
            <h2>{L(T.cv)}</h2>
            <a className="cvbtn" href={PROFILE.cv} target="_blank" rel="noopener"><DownloadIcon />{L(T.download)}</a>
            <div className="cvgrid">
              <div>
                <h3 className="sub" style={{ marginTop: 0 }}>{L(T.education)}</h3>
                <EntryList items={EDUCATION} L={L} />
              </div>
              <div>
                <h3 className="sub" style={{ marginTop: 0 }}>{L(T.experience)}</h3>
                <EntryList items={EXPERIENCE} L={L} />
              </div>
              <div>
                <h3 className="sub" style={{ marginTop: 0 }}>{L(T.awards)}</h3>
                <EntryList items={AWARDS} L={L} />
              </div>
              <div>
                <h3 className="sub" style={{ marginTop: 0 }}>{L(T.memberships)}</h3>
                <EntryList items={MEMBERSHIPS} L={L} />
              </div>
              <div>
                <h3 className="sub" style={{ marginTop: 0 }}>{L(T.skills)}</h3>
                <div className="taglist">
                  <div><strong style={{ color: "var(--ink)" }}>{L(T.software)}. </strong>{SKILLS.software}</div>
                  <div style={{ marginTop: "12px" }}><strong style={{ color: "var(--ink)" }}>{L(T.methods)}. </strong>{L(SKILLS.methods)}</div>
                  <div style={{ marginTop: "12px" }}><strong style={{ color: "var(--ink)" }}>{L(T.languages)}. </strong>{L(SKILLS.languages)}</div>
                </div>
              </div>
            </div>
          </section>

          <section id="contact">
            <h2>{L(T.contact)}</h2>
            <p className="lede">{L(T.contactLede)}</p>
            <div className="herolinks" style={{ marginTop: "6px" }}>
              <a className="pill" href={"mailto:" + PROFILE.email}><MailIcon />{PROFILE.email}</a>
              <button className="pill ghost" onClick={copy}><CopyIcon />{copied ? L(T.copied) : L(T.copy)}</button>
              <a className="pill" href={PROFILE.linkedin} target="_blank" rel="noopener"><LinkedInIcon />{L(T.linkedin)}</a>
              <a className="pill" href={PROFILE.york} target="_blank" rel="noopener">{L(T.yorkProfile)}</a>
              <a className="pill" href={GCS_URL} target="_blank" rel="noopener">GCS Network</a>
            </div>
            <p style={{ marginTop: "22px", fontSize: "15px", color: "var(--muted)" }}>{L(T.dept)}</p>
          </section>
        </main>

        <footer>© {new Date().getFullYear()} {PROFILE.name}</footer>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
